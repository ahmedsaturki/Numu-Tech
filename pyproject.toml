[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "numu-tech"
version = "0.2.0"
description = "Zero-Pain Cloud Migration Automation Engine for Gulf contracting companies"
readme = "README.md"
authors = [
    {name = "Ahmed Turki", email = "ahmed@numu.tech"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "aiohttp>=3.8.0",
    "azure-identity>=1.12.0",
    "azure-mgmt-compute>=27.0.0",
    "azure-mgmt-storage>=20.0.0",
    "azure-mgmt-sql>=2.0.0",
    "boto3>=1.28.0",
    "google-cloud-compute>=1.10.0",
    "google-cloud-storage>=2.10.0",
    "google-cloud-sql>=0.1.0",
    "networkx>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/ahmedsaturki/Numu-Tech"
Repository = "https://github.com/ahmedsaturki/Numu-Tech"
Issues = "https://github.com/ahmedsaturki/Numu-Tech/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "PIE", "BLE", "RUF"]
ignore = ["BLE001"]  # Allow broad exception handling for simulated validation

[tool.ruff.lint.isort]
known-first-party = ["numu_tech"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true